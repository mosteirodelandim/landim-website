name: Astro Build

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/astro-build.yml"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm run check

      - name: Build Astro site
        run: pnpm run build
